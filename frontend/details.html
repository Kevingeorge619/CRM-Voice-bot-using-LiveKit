<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Check-in - Voxtron Tech</title>
    <style>
        /* Consistent styling with the Landing Page */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background-color: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h2 {
            color: #2c3e50;
            margin-bottom: 20px;
        }

        p {
            color: #7f8c8d;
            margin-bottom: 30px;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #2c3e50;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
        }

        input:focus {
            outline: none;
            border-color: #3498db;
        }

        .connect-btn {
            background-color: #e74c3c;
            color: white;
            padding: 12px;
            width: 100%;
            border: none;
            border-radius: 5px;
            font-size: 1.1rem;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }

        .connect-btn:hover {
            background-color: #c0392b;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Customer Support</h2>
        <p>Please enter your details so our AI agent can assist you and create a support ticket if needed.</p>

        <form id="detailsForm">
            <div class="form-group">
                <label for="username">Full Name</label>
                <input type="text" id="username" placeholder="e.g. John Doe" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="e.g. john@example.com" required>
            </div>

            <button type="submit" class="connect-btn">Connect to Agent</button>
        </form>
    </div>

    <script>
        document.getElementById('detailsForm').addEventListener('submit', function(e) {
            e.preventDefault(); // Stop the form from submitting normally

            const name = document.getElementById('username').value;
            const email = document.getElementById('email').value;

            if(name && email) {
                // Save details to Local Storage to use them on the next page
                localStorage.setItem('crm_userName', name);
                localStorage.setItem('crm_userEmail', email);

                // Redirect to the Agent Interface
                window.location.href = 'agent.html';
            } else {
                alert("Please fill in all fields.");
            }
        });
    </script>

</body>
</html>
