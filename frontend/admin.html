<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Voxtron Admin Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f6f9; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        h1 { color: #2c3e50; }
        
        .ticket-card {
            background: white;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border-left: 5px solid #3498db;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .ticket-info h3 { margin: 0 0 5px 0; color: #2c3e50; }
        .ticket-info p { margin: 0; color: #7f8c8d; }
        .status-badge {
            background-color: #2ecc71;
            color: white;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.8rem;
            font-weight: bold;
        }
        .refresh-btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 20px;
        }
        .refresh-btn:hover { background-color: #2980b9; }
    </style>
</head>
<body>

<div class="container">
    <h1>🎫 Support Tickets</h1>
    <button class="refresh-btn" onclick="fetchTickets()">🔄 Refresh List</button>
    <div id="ticket-list">Loading tickets...</div>
</div>

<script>
    async function fetchTickets() {
        const list = document.getElementById('ticket-list');
        try {
            const res = await fetch('http://localhost:8000/api/tickets');
            const tickets = await res.json();
            
            if (tickets.length === 0) {
                list.innerHTML = "<p>No tickets found yet.</p>";
                return;
            }

            list.innerHTML = tickets.map(t => `
                <div class="ticket-card">
                    <div class="ticket-info">
                        <h3>#${t.id} - ${t.customer_name}</h3>
                        <p><strong>Issue:</strong> ${t.issue_description}</p>
                        <p><small>${t.customer_email}</small></p>
                    </div>
                    <span class="status-badge">${t.status}</span>
                </div>
            `).join('');
        } catch (e) {
            list.innerHTML = `<p style="color:red">Error loading tickets: ${e.message}</p>`;
        }
    }

    // Load on start
    fetchTickets();
    // Auto-refresh every 5 seconds
    setInterval(fetchTickets, 5000);
</script>

</body>
</html>
