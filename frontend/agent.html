<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Support - Nexus Tech</title>
    <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
    <style>
        /* Consistent Styling */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #2c3e50; color: white; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }

        .status-container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            width: 90%;
            max-width: 500px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        h2 { margin-bottom: 10px; }
        p { color: #bdc3c7; margin-bottom: 30px; }

        /* Visualizer / Status Indicator */
        .visualizer {
            width: 80px;
            height: 80px;
            background-color: #e74c3c;
            border-radius: 50%;
            margin: 0 auto 30px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.7);
            animation: pulse-red 2s infinite;
        }

        .visualizer.active {
            background-color: #2ecc71;
            animation: pulse-green 2s infinite;
        }

        .icon { font-size: 2rem; }

        /* Buttons */
        .controls { display: flex; justify-content: center; gap: 20px; }
        
        button {
            padding: 10px 25px;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .btn-end { background-color: #e74c3c; color: white; }
        .btn-end:hover { background-color: #c0392b; }

        #statusText { font-weight: bold; color: #f1c40f; }

        /* Animations */
        @keyframes pulse-red {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(231, 76, 60, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(231, 76, 60, 0); }
        }
        @keyframes pulse-green {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 20px rgba(46, 204, 113, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(46, 204, 113, 0); }
        }
    </style>
</head>
<body>

    <div class="status-container">
        <div id="visualizer" class="visualizer">
            <span class="icon">🎙️</span>
        </div>
        
        <h2 id="greeting">Connecting...</h2>
        <p>Status: <span id="statusText">Initializing</span></p>

        <div class="controls">
            <button class="btn-end" onclick="disconnectCall()">End Call</button>
        </div>
        
        <audio id="remote-audio" autoplay></audio>
    </div>

    <script>
        // Retrieve User Details
        const userName = localStorage.getItem('crm_userName');
        const userEmail = localStorage.getItem('crm_userEmail');
        
        // Backend URL (We will build this next)
        const BACKEND_URL = ""; 
        
        let room;

        async function init() {
            if (!userName || !userEmail) {
                alert("User details missing. Redirecting...");
                window.location.href = 'details.html';
                return;
            }

            document.getElementById('greeting').innerText = `Hello, ${userName}`;
            updateStatus("Requesting Access...", "yellow");

            try {
                // 1. Fetch Token from Backend
                const response = await fetch(`${BACKEND_URL}/api/token`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: userName, email: userEmail })
                });
                
                const data = await response.json();
                
                if (!data.token) throw new Error("Failed to get token");

                // 2. Connect to LiveKit
                updateStatus("Connecting to Agent...", "yellow");
                room = new LivekitClient.Room();
                
                // Handle Agent Audio (Subscribe to tracks)
                room.on(LivekitClient.RoomEvent.TrackSubscribed, (track, publication, participant) => {
                    if (track.kind === LivekitClient.Track.Kind.Audio) {
                        const element = track.attach();
                        document.body.appendChild(element);
                    }
                });

                // Handle Disconnect
                room.on(LivekitClient.RoomEvent.Disconnected, () => {
                    updateStatus("Disconnected", "red");
                    document.getElementById('visualizer').classList.remove('active');
                    alert("Call ended.");
                    window.location.href = 'index.html';
                });

                await room.connect(data.ws_url, data.token);
                
                // 3. Enable Microphone
                await room.localParticipant.setMicrophoneEnabled(true);
                
                updateStatus("Connected to Agent", "green");
                document.getElementById('visualizer').classList.add('active');

            } catch (error) {
                console.error(error);
                updateStatus("Connection Failed", "red");
            }
        }

        function updateStatus(text, colorType) {
            const statusEl = document.getElementById('statusText');
            statusEl.innerText = text;
            if(colorType === 'green') statusEl.style.color = '#2ecc71';
            else if(colorType === 'red') statusEl.style.color = '#e74c3c';
            else statusEl.style.color = '#f1c40f';
        }

        function disconnectCall() {
            if (room) room.disconnect();
            window.location.href = 'index.html';
        }

        // Start on load
        window.addEventListener('load', init);
    </script>

</body>
</html>
